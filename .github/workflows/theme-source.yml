name: Publish theme snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "40 8 * * 1-5"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fetch dependency
        run: python -m pip install --disable-pip-version-check -q curl_cffi

      - name: Fetch and validate snapshot
        env:
          TZ: Asia/Shanghai
        run: |
          trade_date="$(date +%F)"
          python tools/export_theme_snapshot.py \
            --output public-data/themes/latest.json \
            --trade-date "$trade_date"

      - name: Commit changed snapshot
        run: |
          if [ -z "$(git status --porcelain -- public-data/themes/latest.json)" ]; then
            echo "snapshot unchanged"
            exit 0
          fi
          git config user.name "gushi-theme-relay[bot]"
          git config user.email "gushi-theme-relay[bot]@users.noreply.github.com"
          git add public-data/themes/latest.json
          git commit -m "data: publish theme snapshot $(TZ=Asia/Shanghai date +%F)"
          git push

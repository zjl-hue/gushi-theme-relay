name: Publish theme snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "40 8 * * 1-5"

permissions:
  contents: write

jobs:
  publish:
    # The data-center F10 endpoint is reachable from the standard runner and
    # does not depend on the blocked push2 quote front doors.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and validate snapshot
        env:
          TZ: Asia/Shanghai
        run: |
          trade_date="$(python -c "from datetime import datetime, timedelta; from zoneinfo import ZoneInfo; d=datetime.now(ZoneInfo('Asia/Shanghai')).date(); d=d-timedelta(days=1) if d.weekday()==5 else d-timedelta(days=2) if d.weekday()==6 else d; print(d)")"
          python tools/export_theme_snapshot.py \
            --output public-data/themes/latest.json \
            --trade-date "$trade_date" \
            --provider datacenter
        shell: bash

      - name: Commit changed snapshot
        run: |
          if [ -z "$(git status --porcelain -- public-data/themes/latest.json)" ]; then
            echo "snapshot unchanged"
            exit 0
          fi
          git config user.name "gushi-theme-relay[bot]"
          git config user.email "gushi-theme-relay[bot]@users.noreply.github.com"
          git add public-data/themes/latest.json
          git commit -m "data: publish theme snapshot $(TZ=Asia/Shanghai date +%F)"
          git push
